<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Delivery Confirmation</title>
<link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
<link as="style" href="https://fonts.googleapis.com/css2?display=swap&amp;family=Inter%3Awght%40400%3B500%3B700%3B900" onload="this.rel='stylesheet'" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#1173d4",
              "background-light": "#f6f7f8",
              "background-dark": "#101922",
            },
            fontFamily: {
              "display": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
      }
      .material-symbols-outlined.fill {
        font-variation-settings:
        'FILL' 1
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-800 dark:text-slate-200">
<div class="flex flex-col h-screen">
<header class="flex items-center p-4 border-b border-slate-200 dark:border-slate-800">
<button class="p-2 -m-2">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="text-lg font-bold text-center flex-1">Delivery Confirmation</h1>
<div class="w-8"></div>
</header>
<main class="flex-1 overflow-y-auto p-6 space-y-8">
<div>
<h2 class="text-xl font-bold mb-4 text-slate-900 dark:text-white">Recipient Signature</h2>
<div class="bg-slate-100 dark:bg-slate-800/50 rounded-xl flex flex-col items-center justify-center p-4 aspect-video">
<span class="material-symbols-outlined text-5xl text-slate-400 dark:text-slate-500">draw</span>
<p class="mt-2 text-sm text-slate-500 dark:text-slate-400">Tap to sign</p>
</div>
</div>
<div>
<h2 class="text-xl font-bold mb-4 text-slate-900 dark:text-white">Proof of Delivery</h2>
<div class="bg-slate-100 dark:bg-slate-800/50 rounded-xl flex flex-col items-center justify-center p-4 aspect-video">
<span class="material-symbols-outlined text-5xl text-slate-400 dark:text-slate-500">add_a_photo</span>
<p class="mt-2 text-sm text-slate-500 dark:text-slate-400">Upload a photo</p>
</div>
</div>
<div>
<label class="block text-xl font-bold mb-4 text-slate-900 dark:text-white" for="notes">Additional Notes</label>
<textarea class="form-textarea w-full h-28 resize-none rounded-xl border-slate-300 dark:border-slate-700 bg-background-light dark:bg-background-dark focus:border-primary focus:ring-primary placeholder-slate-400 dark:placeholder-slate-500" id="notes" placeholder="Optional notes about the delivery..."></textarea>
</div>
<button class="w-full bg-primary text-white font-bold h-12 rounded-xl flex items-center justify-center text-base">
          Confirm Delivery
        </button>
</main>
<nav class="flex justify-around p-2 border-t border-slate-200 dark:border-slate-800">
<a class="flex flex-col items-center gap-1 p-2 text-slate-500 dark:text-slate-400" href="#">
<span class="material-symbols-outlined">dashboard</span>
<span class="text-xs">Dashboard</span>
</a>
<a class="flex flex-col items-center gap-1 p-2 text-slate-500 dark:text-slate-400" href="#">
<span class="material-symbols-outlined">barcode_scanner</span>
<span class="text-xs">Scan</span>
</a>
<a class="flex flex-col items-center gap-1 p-2 rounded-full text-primary" href="#">
<span class="material-symbols-outlined fill">local_shipping</span>
<span class="text-xs font-bold">Shipments</span>
</a>
<a class="flex flex-col items-center gap-1 p-2 text-slate-500 dark:text-slate-400" href="#">
<span class="material-symbols-outlined">leaderboard</span>
<span class="text-xs">Reports</span>
</a>
</nav>
</div>

</body></html>
